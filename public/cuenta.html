<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050907">
<title>Mi cuenta · NEXORA</title>
<link rel="icon" href="/img/nexora-emblem.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/nexora.css">
</head>
<body>
<main class="wrap acct">
  <aside class="side">
    <div class="who"><div class="av" id="av" aria-hidden="true"></div><div><strong id="uname">…</strong><small id="umail"></small></div></div>
    <nav aria-label="Mi cuenta">
      <a href="/cuenta" class="on"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-home"/></svg>Inicio</a>
      <a href="#pedidos"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-list"/></svg>Mis pedidos</a>
      <a href="/ajustes"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-settings"/></svg>Configuración</a>
      <a href="/ajustes#soporte"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-headset"/></svg>Soporte</a>
      <button type="button" id="out"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-logout"/></svg>Cerrar sesión</button>
    </nav>
  </aside>
  <section class="panel">
    <div class="ph"><div><h1>Mi cuenta</h1><p>Tu espacio en NEXORA</p></div><span class="badge">Bienvenido de vuelta</span></div>
    <div class="stats">
      <div class="stat"><b>Bs. 0,00</b><span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-wallet"/></svg>Saldo</span></div>
      <div class="stat"><b id="ocount">0</b><span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-list"/></svg>Pedidos</span></div>
      <div class="stat"><b>0</b><span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-star"/></svg>Puntos</span></div>
    </div>
    <div class="level"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-crown"/></svg><div><strong>Sube de nivel</strong><p>Compra, acumula puntos y desbloquea recompensas.</p></div></div>
    <h2 id="pedidos">Tus últimos pedidos</h2>
    <div class="orders" id="orders" aria-live="polite"><p class="muted">Cargando…</p></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/js/chrome.js"></script>
<script src="/js/account.js"></script>
</body>
</html>
