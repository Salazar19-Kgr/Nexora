<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050907">
<title>Iniciar sesión · NEXORA</title>
<link rel="icon" href="/img/nexora-emblem.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/nexora.css?v=37">
</head>
<body data-mode="login">
<main class="wrap auth-main">
  <section class="auth-card">
    <img class="auth-art" src="/img/girl-art.webp" alt="">
    <div class="auth-body">
      <p class="hello">Bienvenido a</p>
      <div class="brand-big"><svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><use href="#i-logo"/></svg><span class="wm">NEXORA</span></div>
      <p class="lead">Ingresa a tu cuenta y continúa con la experiencia.</p>
      <form id="f" novalidate>
        <div class="field"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-mail"/></svg><input id="ident" type="text" placeholder="Correo electrónico o usuario" autocomplete="username" autocapitalize="none" required aria-label="Correo electrónico o usuario"></div>
        <div class="field"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-lock"/></svg><input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password" required aria-label="Contraseña"><button class="eye" type="button" data-eye="pw" aria-label="Mostrar contraseña"><svg class="ic" viewBox="0 0 24 24"><use href="#i-eye"/></svg></button></div>
        <div id="cap" class="cap"></div>
        <p id="msg" class="msg" role="status"></p>
        <button id="go" class="btn block" type="submit">Iniciar sesión <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow"/></svg></button>
      </form>
      <button class="link" type="button" id="forgot">¿Olvidaste tu contraseña?</button>
      <div class="or">o continúa con</div>
      <div class="socials" id="socials"></div>
      <p class="alt">¿No tienes una cuenta? <a href="/registro">Regístrate aquí</a></p>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/js/chrome.js?v=37"></script>
<script src="/js/captcha.js?v=37"></script>
<script src="/js/auth.js?v=37"></script>
</body>
</html>
