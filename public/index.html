<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050907">
<title>NEXORA · Recargas de videojuegos</title>
<meta name="description" content="Recarga tus juegos favoritos al instante en NEXORA.">
<link rel="icon" href="/img/nexora-emblem.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/nexora.css">
</head>
<body>
<main class="wrap">
  <div class="hero-card"><img src="/img/nexora-banner.svg" alt="NEXORA. Beyond Gaming. Beyond Limits." width="800" height="470"></div>
  <p class="tagline">Recarga a la velocidad del juego</p>
  <div class="dots" id="dots" aria-label="Juegos destacados"></div>

  <label class="search"><span class="sr">Buscar juegos</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg><input id="q" type="search" placeholder="Buscar juegos..." autocomplete="off"></label>

  <section class="promo" aria-labelledby="pt">
    <h2 id="pt">Sube de nivel en segundos</h2>
    <p>Elige tu juego, paga y recibe tu recarga</p>
    <a class="btn" href="/juegos">Ver todos los juegos <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow"/></svg></a>
    <img class="art" src="/img/girl-art.webp" alt="">
  </section>

  <section id="juegos" aria-live="polite">
    <div class="sec-h"><h2>Los más recargados</h2><a class="more" href="/juegos">Ver todos <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow"/></svg></a></div>
    <div class="tiles" id="tiles">
      <div class="tile skel"><div class="art"></div></div><div class="tile skel"><div class="art"></div></div><div class="tile skel"><div class="art"></div></div>
    </div>
  </section>

  <section class="feats" aria-label="Beneficios">
    <div class="feat"><i><svg class="ic" viewBox="0 0 24 24"><use href="#i-bolt"/></svg></i>Entrega Turbo</div>
    <div class="feat"><i><svg class="ic" viewBox="0 0 24 24"><use href="#i-shield"/></svg></i>Pago Blindado</div>
    <div class="feat"><i><svg class="ic" viewBox="0 0 24 24"><use href="#i-headset"/></svg></i>Soporte a un toque</div>
    <div class="feat"><i><svg class="ic" viewBox="0 0 24 24"><use href="#i-crown"/></svg></i>Cupones y Drops</div>
    <div class="feat"><i><svg class="ic" viewBox="0 0 24 24"><use href="#i-panel"/></svg></i>Tu Base de Mando</div>
    <div class="feat"><i><svg class="ic" viewBox="0 0 24 24"><use href="#i-star"/></svg></i>NexoCoins y Ruleta</div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/js/chrome.js"></script>
<script src="/js/art.js"></script>
<script src="/js/home.js"></script>
</body>
</html>
