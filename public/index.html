<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050907">
<title>NEXORA · Recargas de videojuegos</title>
<meta name="description" content="Recarga tus juegos favoritos al instante en NEXORA.">
<link rel="icon" href="/img/nexora-emblem.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/nexora.css">
</head>
<body>
<main class="wrap">
  <div class="hero-card"><img src="/img/nexora-banner.svg" alt="NEXORA. Beyond Gaming. Beyond Limits." width="800" height="470"></div>
  <p class="tagline">Tus juegos favoritos, recargas al instante</p>
  <div class="dots" id="dots" aria-label="Juegos destacados"></div>

  <label class="search"><span class="sr">Buscar juegos</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg><input id="q" type="search" placeholder="Buscar juegos..." autocomplete="off"></label>

  <section class="promo" aria-labelledby="pt">
    <h2 id="pt">Recargas Instantáneas</h2>
    <p>Juega sin límites, recarga al instante</p>
    <a class="btn" href="#juegos">Explorar Tienda <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow"/></svg></a>
    <img class="art" src="/img/nexora-character.svg" alt="">
  </section>

  <section id="juegos" aria-live="polite">
    <div class="sec-h"><h2>Juegos Populares</h2></div>
    <div class="tiles" id="tiles">
      <div class="tile skel"><div class="art"></div></div><div class="tile skel"><div class="art"></div></div><div class="tile skel"><div class="art"></div></div>
    </div>
  </section>

  <section class="feats" aria-label="Beneficios">
    <div class="feat"><i><svg class="ic" viewBox="0 0 24 24"><use href="#i-bolt"/></svg></i>Recargas Instantáneas</div>
    <div class="feat"><i><svg class="ic" viewBox="0 0 24 24"><use href="#i-shield"/></svg></i>Pagos Seguros</div>
    <div class="feat"><i><svg class="ic" viewBox="0 0 24 24"><use href="#i-headset"/></svg></i>Soporte 24/7</div>
    <div class="feat"><i><svg class="ic" viewBox="0 0 24 24"><use href="#i-crown"/></svg></i>Cupones y Descuentos</div>
    <div class="feat"><i><svg class="ic" viewBox="0 0 24 24"><use href="#i-panel"/></svg></i>Panel Profesional</div>
    <div class="feat"><i><svg class="ic" viewBox="0 0 24 24"><use href="#i-star"/></svg></i>Sistema de Puntos</div>
  </section>
</main>

<dialog id="checkout">
  <form id="form" method="dialog">
    <h2 id="gname"></h2>
    <label>Paquete <select id="product" required></select></label>
    <label>ID de jugador <input id="player_id" required maxlength="64" autocomplete="off"></label>
    <label id="server_row" hidden>Servidor (opcional) <input id="server" maxlength="64" autocomplete="off"></label>
    <p id="msg" class="muted" role="status"></p>
    <div class="row"><button value="cancel" class="btn ghost" formnovalidate>Cerrar</button><button id="buy" class="btn" type="submit">Realizar recarga</button></div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/js/chrome.js"></script>
<script src="/js/home.js"></script>
</body>
</html>
