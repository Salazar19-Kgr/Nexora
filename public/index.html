<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050907">
<title>NEXORA · Recargas de videojuegos</title>
<meta name="description" content="Recarga tus juegos favoritos al instante en NEXORA.">
<link rel="icon" href="/img/nexora-emblem.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/nexora.css?v=37">
<link rel="stylesheet" href="/css/theme.css?v=37">
</head>
<body class="home">
<main class="wrap hm">

  <section class="hero nx-frame" id="hero" aria-roledescription="carrusel" aria-label="Promociones de NEXORA">
    <div class="hfx" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <img class="hart" id="hart" src="/img/girl-art.webp" alt="" width="811" height="1000" fetchpriority="high" decoding="async">
    <img class="hcat" id="hcat" src="/img/gato.webp" alt="" width="167" height="140" decoding="async">
    <div class="hslides" id="hslides" aria-live="polite"></div>
    <div class="hdots" id="hdots" role="tablist" aria-label="Elegir banner"></div>
  </section>

  <section class="perks nx-frame" aria-label="Beneficios">
    <div class="perk"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-bolt"/></svg><span>Entrega<br>ultra rápida</span></div>
    <div class="perk"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-shield"/></svg><span>Pago<br>seguro</span></div>
    <div class="perk"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-headset"/></svg><span>Soporte<br>24/7</span></div>
    <div class="perk"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-gift"/></svg><span>Promociones<br>exclusivas</span></div>
  </section>

  <section aria-labelledby="ct">
    <div class="sec-h2"><h2 id="ct"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-gamepad"/></svg>Categorías</h2><a class="more2" href="/juegos">Ver todas <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow"/></svg></a></div>
    <div class="cats" id="cats" aria-live="polite"><div class="cat sk"></div><div class="cat sk"></div><div class="cat sk"></div></div>
  </section>

  <section class="promo2 nx-frame" id="promo2" aria-label="Promoción">
    <img class="pgifts" id="pgifts" src="/img/regalos.webp" alt="" width="207" height="235" loading="lazy" decoding="async">
    <div class="ptxt">
      <h2><span class="l1" id="p1"></span><span class="l2" id="p2"></span></h2>
      <p id="psub"></p>
      <a class="cta" id="pcta" href="/cuenta#recompensas"><span></span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow"/></svg></a>
    </div>
    <img class="part" id="part" src="/img/promo-general.webp" alt="" width="315" height="246" loading="lazy" decoding="async">
    <span class="pbadge" id="pbadge" hidden></span>
  </section>

  <section aria-labelledby="mv">
    <div class="sec-h2"><h2 id="mv"><svg class="ic fl" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-flame"/></svg>Más vendidos</h2><a class="more2" href="/juegos">Ver todos <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow"/></svg></a></div>
    <div class="best" id="best" aria-live="polite"><div class="bcard sk"></div><div class="bcard sk"></div></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/js/chrome.js?v=37"></script>
<script src="/js/art.js?v=37"></script>
<script src="/js/home.js?v=37"></script>
</body>
</html>
