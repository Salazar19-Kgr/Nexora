<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050907">
<title>Recargar · NEXORA</title>
<link rel="icon" href="/img/nexora-emblem.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/nexora.css">
</head>
<body>
<main class="wrap page narrow">
  <a class="back" href="/juegos"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-back"/></svg>Juegos</a>
  <header class="ghead"><div id="glogo"></div><div><h1 id="gname">Cargando…</h1><p class="muted" id="gcat"></p></div></header>

  <section class="step">
    <h2><span class="n">1</span>Elige tu paquete</h2>
    <div class="cbar" id="cbar"></div>
    <div class="plist" id="plist" role="radiogroup" aria-label="Paquetes"></div>
  </section>

  <section class="step" id="step2" hidden>
    <h2><span class="n">2</span>Datos de tu cuenta</h2>
    <div class="card">
      <label>ID de jugador<input id="player_id" maxlength="64" autocomplete="off" inputmode="numeric" placeholder="Ej: 123456789"></label>
      <label id="server_row" hidden>Servidor<input id="server" maxlength="64" autocomplete="off" placeholder="Ej: 2201"></label>
      <button class="btn ghost sm" type="button" id="chkid" hidden>Verificar mi ID</button>
      <p class="msg" id="idres" role="status"></p>
      <p class="muted" id="vnote">Revisa bien tu ID: las recargas no se pueden cambiar de cuenta.</p>
    </div>
    <label class="trow coinrow" id="coinrow" hidden>
      <span class="tico" id="coico"></span>
      <span class="tt"><b>Usar mis NexoCoins</b><small id="coinhint"></small></span>
      <input type="checkbox" id="usecoins" class="sw" aria-label="Usar mis NexoCoins">
    </label>
    <details class="cpn">
      <summary><span class="tico cp"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-star"/></svg></span><span class="tt"><b>Cupón de descuento</b><small>Opcional</small></span></summary>
      <input id="coupon" maxlength="32" autocomplete="off" autocapitalize="characters" placeholder="Ej: NX-ABCD-1234" aria-label="Cupón de descuento">
    </details>
    <div class="card sumry" id="sumry">
      <h3>Resumen de pago</h3>
      <div class="srow"><span>Precio</span><b id="sPrice">—</b></div>
      <div class="srow" id="sDiscRow" hidden><span>Descuento con NexoCoins</span><b id="sDisc" class="dsc"></b></div>
      <div class="srow tot"><span>Total</span><b id="sTot">—</b></div>
      <p class="muted" id="sVes"></p>
    </div>
  </section>
  <p id="msg" class="msg" role="status"></p>
</main>
<div class="buybar" id="buybar" hidden>
  <div class="tot"><small>Total</small><b id="total">$0.00</b><small id="totves"></small></div>
  <button class="btn" id="buy" type="button">Recargar ahora</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/js/chrome.js"></script>
<script src="/js/art.js"></script>
<script src="/js/juego.js"></script>
</body>
</html>
