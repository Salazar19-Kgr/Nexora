<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050907">
<title>Ajustes · NEXORA</title>
<link rel="icon" href="/img/nexora-emblem.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/nexora.css">
</head>
<body>
<main class="wrap acct">
  <aside class="side">
    <div class="who"><div class="av" id="av" aria-hidden="true"></div><div><strong id="uname">…</strong><small id="umail"></small></div></div>
    <nav aria-label="Ajustes">
      <a href="#perfil" class="on"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-user"/></svg>Perfil</a>
      <a href="#seguridad"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-shield"/></svg>Seguridad</a>
      <a href="#soporte"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-headset"/></svg>Soporte</a>
      <a href="/cuenta"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-home"/></svg>Mi cuenta</a>
    </nav>
  </aside>
  <section class="panel set">
    <div class="ph"><div><h1>Configuración</h1><p>Administra tu perfil y tu cuenta</p></div></div>

    <div class="card" id="perfil">
      <h2>Perfil</h2>
      <p>Estos datos identifican tu cuenta.</p>
      <label>Nombre de usuario<input id="f-user" readonly></label>
      <label>Correo electrónico<input id="f-mail" readonly></label>
    </div>

    <div class="card" id="seguridad">
      <h2>Seguridad</h2>
      <p>Cambia tu contraseña. Usa al menos 8 caracteres.</p>
      <form id="pwf" novalidate>
        <label>Nueva contraseña<input id="np" type="password" autocomplete="new-password" minlength="8"></label>
        <label>Confirmar contraseña<input id="np2" type="password" autocomplete="new-password"></label>
        <p id="pmsg" class="msg" role="status"></p>
        <button class="btn" type="submit" id="pbtn">Guardar contraseña</button>
      </form>
    </div>

    <div class="card" id="soporte">
      <h2>Soporte</h2>
      <p>¿Dudas con una recarga o un pedido? Escríbenos y te ayudamos.</p>
      <div class="btns">
        <a class="btn" href="https://wa.me/584245095002?text=Hola%20NEXORA" target="_blank" rel="noopener"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chat"/></svg>WhatsApp</a>
        <a class="btn ghost" href="mailto:prds33735435@gmail.com"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-mail"/></svg>Correo</a>
      </div>
    </div>

    <div class="btns"><button type="button" class="btn ghost" id="out"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-logout"/></svg>Cerrar sesión</button></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/js/chrome.js"></script>
<script src="/js/account.js"></script>
</body>
</html>
